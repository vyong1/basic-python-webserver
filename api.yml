openapi: 3.0.0
info:
  title: Items API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      summary: Check server health
      responses:
        '200':
          description: The server is healthy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
  /getItems/:
    get:
      operationId: getItems
      summary: Get all items
      description: Returns the items saved in the database.
      responses:
        '200':
          description: The saved items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
  /putItem/:
    post:
      operationId: putItem
      summary: Save an item
      description: Saves an item to the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
      responses:
        '201':
          description: The item was saved.
        '400':
          description: The value must be a string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /patchItem/:
    patch:
      operationId: patchItem
      summary: Update an item
      description: Updates an existing item in the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '200':
          description: The item was updated.
        '400':
          description: The body must contain an integer ID and a string value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No item with that ID exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /deleteItem/:
    delete:
      operationId: deleteItem
      summary: Delete an item
      description: Deletes an item from the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemId'
      responses:
        '200':
          description: The item was deleted.
        '400':
          description: The request body must contain an integer ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No item with that ID exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    Item:
      type: object
      required:
        - id
        - value
      properties:
        id:
          type: integer
        value:
          type: string
    NewItem:
      type: object
      required:
        - value
      properties:
        value:
          type: string
    ItemId:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
