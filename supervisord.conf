[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:gunicorn1]
command=gunicorn --bind 127.0.0.1:8000 --workers 2 --forwarded-allow-ips=127.0.0.1 %(ENV_APP_MODULE)s
directory=/app
user=app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gunicorn2]
command=gunicorn --bind 127.0.0.1:8001 --workers 2 --forwarded-allow-ips=127.0.0.1 %(ENV_APP_MODULE)s
directory=/app
user=app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0